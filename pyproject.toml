[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "LFdemod"
version = "0.2.0.dev0"
description = "Low-frequency radio demodulation and diagnostic processing from raw voltage data"
authors = [{name = "Yanbin Yang", email = "yangyanbin@shao.ac.cn"}]
readme = "Readme.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "matplotlib",
    "scipy"
]

[project.optional-dependencies]
starlink-vhf = ["lora-phy==0.3.0"]

[project.scripts]
lfdemod = "lfdemod.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
"Homepage" = "https://github.com/JinYi1108/LFdemod"
"Source" = "https://github.com/JinYi1108/LFdemod"
"Data" = "https://zenodo.org/records/18213739"
"Legacy-ORBCOMM-Software-DOI" = "https://doi.org/10.5281/zenodo.18214211"
"Legacy-PyPI" = "https://pypi.org/project/orbdemod/"
